# render.yaml - Cấu hình tự động cho Render.com

services:
  - type: web
    name: tthc-dongthap
    runtime: python
    repo: https://github.com/your-username/tthc-dongthap  # Thay bằng repo của bạn
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER_EXTERNAL_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true
