{% extends "base.html" %}

{% block title %}Đổi mật khẩu{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 500px;">
    <h3><i class="fas fa-key"></i> ĐỔI MẬT KHẨU</h3>
    <hr>
    <form method="POST">
        <div class="form-group"><label>Mật khẩu cũ</label><input type="password" name="old_password" class="form-control" required></div>
        <div class="form-group"><label>Mật khẩu mới</label><input type="password" name="new_password" class="form-control" required minlength="6"></div>
        <div class="form-group"><label>Xác nhận mật khẩu mới</label><input type="password" name="confirm_password" class="form-control" required></div>
        <button type="submit" class="btn btn-primary w-100"><i class="fas fa-save"></i> Đổi mật khẩu</button>
    </form>
</div>
{% endblock %}
