{% extends "base.html" %}

{% block title %}{{ 'Sửa' if quyet_dinh else 'Thêm mới' }} Quyết định{% endblock %}

{% block content %}
<div class="form-container">
    <h3><i class="fas {{ 'fa-edit' if quyet_dinh else 'fa-plus' }}"></i> {{ 'CẬP NHẬT' if quyet_dinh else 'THÊM MỚI' }} QUYẾT ĐỊNH</h3>
    <hr>
    <form method="POST" enctype="multipart/form-data">
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label>Số quyết định <span class="text-danger">*</span></label>
                    <input type="text" name="so_quyet_dinh" class="form-control" value="{{ quyet_dinh[1] if quyet_dinh else '' }}" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label>Ngày ban hành</label>
                    <input type="date" name="ngay_ban_hanh" class="form-control" value="{{ quyet_dinh[3] if quyet_dinh else '' }}">
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>Tên quyết định</label>
            <input type="text" name="ten_quyet_dinh" class="form-control" value="{{ quyet_dinh[2] if quyet_dinh else '' }}">
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label>Loại quyết định</label>
                    <select name="loai" class="form-control">
                        <option value="cong_bo" {% if quyet_dinh and quyet_dinh[4] == 'cong_bo' %}selected{% endif %}>Công bố</option>
                        <option value="sua_doi" {% if quyet_dinh and quyet_dinh[4] == 'sua_doi' %}selected{% endif %}>Sửa đổi</option>
                        <option value="bo_sung" {% if quyet_dinh and quyet_dinh[4] == 'bo_sung' %}selected{% endif %}>Bổ sung</option>
                        <option value="huy_bo" {% if quyet_dinh and quyet_dinh[4] == 'huy_bo' %}selected{% endif %}>Hủy bỏ</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label>File đính kèm</label>
                    <input type="file" name="file_dinh_kem" class="form-control" accept=".pdf,.doc,.docx">
                    {% if quyet_dinh and quyet_dinh[6] %}
                    <small class="text-muted">File hiện tại: {{ quyet_dinh[6] }}</small>
                    <input type="hidden" name="existing_file" value="{{ quyet_dinh[6] }}">
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>Mô tả nội dung</label>
            <textarea name="mo_ta" class="form-control" rows="4">{{ quyet_dinh[5] if quyet_dinh else '' }}</textarea>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Lưu lại</button>
            <a href="/quyet_dinh" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Quay lại</a>
        </div>
    </form>
</div>
{% endblock %}
