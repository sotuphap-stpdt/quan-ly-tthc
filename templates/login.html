{% extends "base.html" %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white text-center border-0">
                <h4><i class="fas fa-file-alt"></i> HỆ THỐNG TTHC</h4>
                <small>Sở Tư pháp tỉnh Đồng Tháp</small>
            </div>
            <div class="card-body p-4">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-user"></i> Tên đăng nhập</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="fas fa-lock"></i> Mật khẩu</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="fas fa-sign-in-alt"></i> Đăng nhập
                    </button>
                </form>
                <hr>
                <div class="text-center text-muted small">
                    <p>Tài khoản mặc định: <strong>Admin</strong> / <strong>admin@123</strong></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
