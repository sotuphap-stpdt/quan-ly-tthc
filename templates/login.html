<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - QL TTHC Đồng Tháp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #0d5c2a 0%, #1e8e3e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            border-radius: 32px;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.95);
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #1e8e3e, #0d5c2a);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .login-body {
            padding: 40px;
        }
        .form-control {
            border-radius: 16px;
            padding: 12px 20px;
            border: 1px solid #e0e0e0;
        }
        .form-control:focus {
            border-color: #1e8e3e;
            box-shadow: 0 0 0 0.2rem rgba(30,142,62,0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #1e8e3e, #0d5c2a);
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            color: white;
            transition: 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30,142,62,0.4);
        }
        .footer-text {
            font-size: 0.8rem;
            color: #6c757d;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="login-card">
                    <div class="login-header">
                        <i class="fas fa-gavel fa-3x mb-3"></i>
                        <h3 class="fw-bold mb-0">Sở Tư pháp Đồng Tháp</h3>
                        <p class="mb-0 opacity-75">Hệ thống quản lý TTHC</p>
                    </div>
                    <div class="login-body">
                        {% if error %}
                        <div class="alert alert-danger rounded-4 border-0">
                            <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
                        </div>
                        {% endif %}
                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên đăng nhập</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0 rounded-4"><i class="fas fa-user text-success"></i></span>
                                    <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0 rounded-4"><i class="fas fa-lock text-success"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-login w-100">
                                <i class="fas fa-sign-in-alt me-2"></i>Đăng nhập
                            </button>
                        </form>
                        <hr class="my-4">
                        <div class="footer-text">
                            <i class="fas fa-phone-alt me-1"></i> 085 3993 892
                            <span class="mx-2">|</span>
                            <i class="fas fa-envelope me-1"></i> stp@dongthap.gov.vn
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
