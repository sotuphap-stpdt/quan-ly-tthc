{% extends "base.html" %}

{% block title %}{{ 'Sửa' if user else 'Thêm mới' }} người dùng{% endblock %}

{% block content %}
<div class="form-container">
    <h3><i class="fas {{ 'fa-edit' if user else 'fa-plus' }}"></i> {{ 'CẬP NHẬT' if user else 'THÊM MỚI' }} NGƯỜI DÙNG</h3>
    <hr>
    <form method="POST">
        <div class="row">
            <div class="col-md-6">
                <div class="form-group"><label>Tên đăng nhập</label><input type="text" name="username" class="form-control" value="{{ user[1] if user else '' }}" required></div>
            </div>
            <div class="col-md-6">
                <div class="form-group"><label>Họ tên</label><input type="text" name="fullname" class="form-control" value="{{ user[3] if user else '' }}"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" value="{{ user[4] if user else '' }}"></div>
            </div>
            <div class="col-md-6">
                <div class="form-group"><label>Vai trò</label>
                    <select name="role" class="form-control">
                        <option value="user" {% if user and user[2] == 'user' %}selected{% endif %}>Người dùng</option>
                        <option value="admin" {% if user and user[2] == 'admin' %}selected{% endif %}>Quản trị viên</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="form-group"><label>{{ 'Mật khẩu mới' if user else 'Mật khẩu' }}</label>
            <input type="password" name="{% if user %}new_password{% else %}password{% endif %}" class="form-control" {% if not user %}required{% endif %}>
            {% if user %}<small class="text-muted">Để trống nếu không đổi mật khẩu</small>{% endif %}
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Lưu lại</button>
            <a href="/users" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Quay lại</a>
        </div>
    </form>
</div>
{% endblock %}
