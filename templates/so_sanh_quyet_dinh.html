{% extends "base.html" %}
{% block title %}So sánh quyết định{% endblock %}
{% block content %}
<div class="fade-in-up">
    <h2 class="fw-bold mb-4">
        <i class="fas fa-code-branch me-2" style="color: #1e8e3e;"></i>
        SO SÁNH QUYẾT ĐỊNH
    </h2>

    <div class="card-modern mb-4">
        <div class="card-header-custom">
            <h4 class="mb-0"><i class="fas fa-balance-scale me-2"></i> Chọn quyết định để so sánh</h4>
        </div>
        <div class="card-body p-4">
            <div class="row">
                <div class="col-md-5">
                    <label class="form-label fw-semibold">Quyết định 1</label>
                    <select id="qd1" class="form-select rounded-3">
                        <option value="">-- Chọn quyết định --</option>
                        {% for qd in quyet_dinh_list %}
                        <option value="{{ qd[0] }}">{{ qd[1] }} - {{ qd[2] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2 text-center d-flex align-items-center justify-content-center">
                    <i class="fas fa-exchange-alt fa-2x text-success"></i>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-semibold">Quyết định 2</label>
                    <select id="qd2" class="form-select rounded-3">
                        <option value="">-- Chọn quyết định --</option>
                        {% for qd in quyet_dinh_list %}
                        <option value="{{ qd[0] }}">{{ qd[1] }} - {{ qd[2] }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="text-center mt-4">
                <button id="btnCompare" class="btn btn-gradient px-4">
                    <i class="fas fa-code-branch me-2"></i> So sánh ngay
                </button>
            </div>
        </div>
    </div>

    <div id="compareResult" style="display: none;">
        <div class="card-modern mb-4">
            <div class="card-header-custom">
                <h4 class="mb-0"><i class="fas fa-info-circle me-2"></i> Thông tin quyết định</h4>
            </div>
            <div class="card-body p-4">
                <div class="row">
                    <div class="col-md-6 border-end">
                        <div id="info1"></div>
                    </div>
                    <div class="col-md-6">
                        <div id="info2"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-modern">
            <div class="card-header-custom">
                <h4 class="mb-0"><i class="fas fa-list-ul me-2"></i> Danh sách TTHC theo từng quyết định</h4>
            </div>
            <div class="card-body p-4">
                <div class="row">
                    <div class="col-md-6">
                        <h5 class="fw-bold text-success mb-3"><i class="fas fa-check-circle me-2"></i> TTHC theo QĐ1</h5>
                        <div id="tthcList1" class="table-responsive">
                            <div class="text-muted">Chưa chọn quyết định</div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h5 class="fw-bold text-primary mb-3"><i class="fas fa-check-circle me-2"></i> TTHC theo QĐ2</h5>
                        <div id="tthcList2" class="table-responsive">
                            <div class="text-muted">Chưa chọn quyết định</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('btnCompare').addEventListener('click', function() {
    const qd1 = document.getElementById('qd1').value;
    const qd2 = document.getElementById('qd2').value;
    
    if (!qd1 || !qd2) {
        alert('Vui lòng chọn đủ 2 quyết định để so sánh!');
        return;
    }
    
    if (qd1 === qd2) {
        alert('Vui lòng chọn 2 quyết định khác nhau!');
        return;
    }
    
    fetch(`/api/so_sanh_quyet_dinh?qd_ids=${qd1},${qd2}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
                return;
            }
            
            document.getElementById('compareResult').style.display = 'block';
            
            // Hiển thị thông tin
            const qd1Data = data.quyet_dinhs[0];
            const qd2Data = data.quyet_dinhs[1];
            
            document.getElementById('info1').innerHTML = `
                <div class="bg-light p-3 rounded-3">
                    <p><strong>Số QĐ:</strong> ${escapeHtml(qd1Data.so_quyet_dinh)}</p>
                    <p><strong>Tên QĐ:</strong> ${escapeHtml(qd1Data.ten_quyet_dinh)}</p>
                    <p><strong>Ngày ban hành:</strong> ${qd1Data.ngay_ban_hanh}</p>
                    <p><strong>Loại:</strong> ${qd1Data.loai}</p>
                </div>
            `;
            
            document.getElementById('info2').innerHTML = `
                <div class="bg-light p-3 rounded-3">
                    <p><strong>Số QĐ:</strong> ${escapeHtml(qd2Data.so_quyet_dinh)}</p>
                    <p><strong>Tên QĐ:</strong> ${escapeHtml(qd2Data.ten_quyet_dinh)}</p>
                    <p><strong>Ngày ban hành:</strong> ${qd2Data.ngay_ban_hanh}</p>
                    <p><strong>Loại:</strong> ${qd2Data.loai}</p>
                </div>
            `;
            
            // Hiển thị danh sách TTHC
            const tthc1 = data.tthc_theo_qd[qd1Data.id] || [];
            const tthc2 = data.tthc_theo_qd[qd2Data.id] || [];
            
            if (tthc1.length > 0) {
                let html = '<table class="table table-sm table-bordered"><thead><tr><th>Mã TTHC</th><th>Tên TTHC</th></tr></thead><tbody>';
                tthc1.forEach(t => {
                    html += `<tr><td>${escapeHtml(t[0])}</td><td>${escapeHtml(t[1])}</td></tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('tthcList1').innerHTML = html;
            } else {
                document.getElementById('tthcList1').innerHTML = '<div class="text-muted">Không có TTHC nào theo quyết định này</div>';
            }
            
            if (tthc2.length > 0) {
                let html = '<table class="table table-sm table-bordered"><thead><tr><th>Mã TTHC</th><th>Tên TTHC</th></tr></thead><tbody>';
                tthc2.forEach(t => {
                    html += `<tr><td>${escapeHtml(t[0])}</td><td>${escapeHtml(t[1])}</td></tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('tthcList2').innerHTML = html;
            } else {
                document.getElementById('tthcList2').innerHTML = '<div class="text-muted">Không có TTHC nào theo quyết định này</div>';
            }
        })
        .catch(error => {
            console.error('Lỗi:', error);
            alert('Lỗi khi so sánh quyết định!');
        });
});
</script>
{% endblock %}
