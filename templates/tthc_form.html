{% extends "base.html" %}

{% block title %}{{ 'Sửa' if tthc else 'Thêm mới' }} TTHC{% endblock %}

{% block content %}
<div class="form-container">
    <h3><i class="fas {{ 'fa-edit' if tthc else 'fa-plus' }}"></i> {{ 'CẬP NHẬT' if tthc else 'THÊM MỚI' }} THỦ TỤC HÀNH CHÍNH</h3>
    <hr>
    
    <form method="POST">
        <div class="row">
            <div class="col-md-6">
                <div class="form-group">
                    <label>Mã TTHC <span class="text-danger">*</span></label>
                    <input type="text" name="ma_tthc" class="form-control" value="{{ tthc[1] if tthc else '' }}" required>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-group">
                    <label>Lĩnh vực</label>
                    <select name="linh_vuc" class="form-control">
                        <option value="">-- Chọn lĩnh vực --</option>
                        {% for lv in linh_vuc_list %}
                        <option value="{{ lv }}" {% if tthc and tthc[3] == lv %}selected{% endif %}>{{ lv }}</option>
                        {% endfor %}
                        <option value="Khác">Khác</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="form-group">
            <label>Tên TTHC <span class="text-danger">*</span></label>
            <input type="text" name="ten_tthc" class="form-control" value="{{ tthc[2] if tthc else '' }}" required>
        </div>
        
        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label>Phí, lệ phí</label>
                    <input type="text" name="phi" class="form-control" value="{{ tthc[4] if tthc else '' }}">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label>Cấp thực hiện</label>
                    <select name="cap_thuc_hien" class="form-control">
                        <option value="tinh" {% if tthc and tthc[13] == 'tinh' %}selected{% endif %}>Cấp tỉnh</option>
                        <option value="xa" {% if tthc and tthc[13] == 'xa' %}selected{% endif %}>Cấp xã</option>
                        <option value="bo" {% if tthc and tthc[13] == 'bo' %}selected{% endif %}>Cấp Bộ</option>
                        <option value="dung_chung" {% if tthc and tthc[13] == 'dung_chung' %}selected{% endif %}>Dùng chung</option>
                    </select>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label>Cơ quan thực hiện</label>
                    <input type="text" name="co_quan_thuc_hien" class="form-control" value="{{ tthc[16] if tthc and tthc[16] else '' }}">
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label>Thời gian giải quyết</label>
                    <input type="text" name="thoi_gian_giai_quyet" class="form-control" value="{{ tthc[19] if tthc and tthc[19] else '' }}" placeholder="VD: 05 ngày làm việc">
                </div>
            </div>
            <div class="col-md-8">
                <div class="form-group">
                    <label>Thành phần hồ sơ</label>
                    <input type="text" name="thanh_phan_ho_so" class="form-control" value="{{ tthc[18] if tthc and tthc[18] else '' }}">
                </div>
            </div>
        </div>
        
        <div class="form-group">
            <label>Căn cứ pháp lý</label>
            <textarea name="can_cu_phap_ly" class="form-control" rows="3">{{ tthc[20] if tthc and tthc[20] else '' }}</textarea>
        </div>
        
        <div class="row">
            <div class="col-md-4">
                <div class="form-check">
                    <input type="checkbox" name="dvc_toan_trinh" value="X" class="form-check-input" id="dvc1" {% if tthc and tthc[8] == 'X' %}checked{% endif %}>
                    <label class="form-check-label" for="dvc1">DVC toàn trình</label>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-check">
                    <input type="checkbox" name="dvc_mot_phan" value="X" class="form-check-input" id="dvc2" {% if tthc and tthc[9] == 'X' %}checked{% endif %}>
                    <label class="form-check-label" for="dvc2">DVC một phần</label>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-check">
                    <input type="checkbox" name="dvc_cung_cap_tt" value="X" class="form-check-input" id="dvc3" {% if tthc and tthc[10] == 'X' %}checked{% endif %}>
                    <label class="form-check-label" for="dvc3">Cung cấp thông tin</label>
                </div>
            </div>
        </div>
        
        <div class="mt-4">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Lưu lại</button>
            <a href="/tthc" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Quay lại</a>
        </div>
    </form>
</div>
{% endblock %}
